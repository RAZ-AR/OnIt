services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: onit-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ../.env
        required: false
    environment:
      - PORT=3001
      - POCKETBASE_URL=http://pocketbase:8090
    depends_on:
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: onit-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: onit-osrm
    restart: unless-stopped
    profiles: ["geo"]
    ports:
      - "5000:5000"
    volumes:
      - ./osrm/data:/data
    command: osrm-routed --algorithm mld /data/armenia-latest.osrm
