name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Verify Cloudflare Pages static export
        run: STATIC_EXPORT=1 pnpm --filter @onit/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @onit/web exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm test:e2e
